[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchgraph-qa"
version = "0.0.1"
description = "Verifiable question-answer benchmark over real repository code graphs, anchored on gold-patch symbols (Gemma 4 Developer Agent paper track)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Víctor Andrade" }]
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "nbformat>=5.9"]
notebook = ["matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables inside notebook-builder strings cannot be wrapped.
"scripts/build_notebook.py" = ["E501"]

[tool.ruff.format]
# Keep the notebook builder's cell-per-block layout readable.
exclude = ["scripts/build_notebook.py"]
